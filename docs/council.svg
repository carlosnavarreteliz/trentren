<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" role="img" aria-labelledby="t d">
  <title id="t">The Trentren council</title>
  <desc id="d">An earthquake triggers a pre-alert. Three specialist agents (Seismologist, Media watch, Civil protection) work in parallel with their own tools, debate around a round table, and report to Trentren, the coordinator, who issues the alert level.</desc>
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="10"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0.045 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#5E5A52"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#C8553D"/>
    </marker>
    <clipPath id="frame"><rect width="1400" height="940" rx="22"/></clipPath>
    <style>
      text { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #2B2A33; }
      .serif { font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif; font-style: italic; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
      .tag { font-size: 14px; font-weight: 600; letter-spacing: 3px; fill: #8A8276; }
      .h { font-size: 40px; font-weight: 600; }
      .step { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; fill: #5E5A52; }
      .tiny { font-size: 12.5px; fill: #8A8276; }
      .name { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .tool { font-size: 13.5px; text-anchor: middle; fill: #3E3B44; }
      .c { text-anchor: middle; }
      @media (prefers-reduced-motion: no-preference) {
        .ring { stroke-dashoffset: 0; animation: flow 6s linear infinite; }
        .pulse { transform-origin: 170px 250px; animation: pulse 3.2s ease-out infinite; }
        .pulse.b { animation-delay: 1.6s; }
        .breathe { transform-origin: 720px 500px; animation: breathe 5s ease-in-out infinite; }
        @keyframes flow { to { stroke-dashoffset: -240; } }
        @keyframes pulse { from { transform: scale(0.25); opacity: 0.8; } to { transform: scale(1.25); opacity: 0; } }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(1.06); opacity: 0.85; } }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1400" height="940" fill="#FAF6EE"/>

    <!-- watercolor washes: the round table and the light around the coordinator -->
    <g filter="url(#soft)">
      <circle cx="720" cy="500" r="300" fill="#EFE5D6" opacity="0.8"/>
      <circle cx="170" cy="250" r="110" fill="#F3D9CE" opacity="0.7"/>
      <ellipse cx="1230" cy="490" rx="150" ry="200" fill="#EEE8DD" opacity="0.8"/>
    </g>
    <circle class="breathe" cx="720" cy="500" r="128" fill="#F6DCD3" filter="url(#soft)" opacity="0.6"/>

    <!-- header -->
    <text x="60" y="66" class="tag">THE COUNCIL</text>
    <text x="60" y="114" class="h serif">Four agents, one decision</text>
    <g>
      <rect x="902" y="46" width="438" height="38" rx="19" fill="#FFFDF8" stroke="#E4DCCD"/>
      <circle cx="926" cy="65" r="6" fill="#0866FF"/>
      <text x="942" y="70" class="small">Every agent runs on <tspan font-weight="600" fill="#2B2A33">Meta Muse Wonder</tspan> · Meta Model API</text>
    </g>

    <!-- 1 · watch -->
    <g fill="none" stroke="#C8553D">
      <circle cx="170" cy="250" r="36" stroke-width="1.6" opacity="0.55"/>
      <circle cx="170" cy="250" r="58" stroke-width="1.4" opacity="0.32"/>
      <circle cx="170" cy="250" r="80" stroke-width="1.2" opacity="0.16"/>
      <circle class="pulse" cx="170" cy="250" r="80" stroke-width="2" opacity="0"/>
      <circle class="pulse b" cx="170" cy="250" r="80" stroke-width="2" opacity="0"/>
    </g>
    <circle cx="170" cy="250" r="12" fill="#C8553D"/>
    <text x="170" y="370" class="step c">1 · Watch</text>
    <text x="170" y="394" class="small c">CSN + USGS feeds, every 2 min</text>
    <text x="170" y="415" class="tiny c">trigger: M ≥ 4.7</text>

    <!-- 2 · pre-alert -->
    <rect x="60" y="456" width="222" height="100" rx="16" fill="#FFFDF8" stroke="#E4DCCD"/>
    <text x="82" y="490" class="step">2 · Pre-alert</text>
    <text x="82" y="514" class="small">rules + country model</text>
    <text x="82" y="536" class="small">in the database in &lt; 1 s</text>

    <!-- 3 · convene -->
    <path d="M286 506 C 340 506, 400 500, 452 500" fill="none" stroke="#5E5A52" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="368" y="488" class="step c" font-size="14">3 · Convene</text>

    <!-- tool tethers (drawn under the discs) -->
    <g stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round" fill="none">
      <g stroke="#C98A34">
        <line x1="720" y1="240" x2="540" y2="150"/><line x1="720" y1="240" x2="470" y2="225"/>
        <line x1="720" y1="240" x2="900" y2="150"/><line x1="720" y1="240" x2="975" y2="225"/>
      </g>
      <g stroke="#5B8DB8"><line x1="495" y1="630" x2="330" y2="722"/><line x1="495" y1="630" x2="380" y2="792"/></g>
      <g stroke="#6E9466"><line x1="945" y1="630" x2="1090" y2="722"/><line x1="945" y1="630" x2="1060" y2="792"/></g>
    </g>

    <!-- 4 · the round table (debate) -->
    <circle cx="720" cy="500" r="260" fill="none" stroke="#E6DED0" stroke-width="10"/>
    <circle class="ring" cx="720" cy="500" r="260" fill="none" stroke="#9C89B8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <g fill="#9C89B8">
      <circle cx="590" cy="275" r="4"/><circle cx="850" cy="275" r="4"/><circle cx="720" cy="760" r="4"/>
    </g>
    <text x="720" y="790" class="step c" fill="#7B6A99">4 · Debate</text>
    <text x="720" y="812" class="tiny c">each specialist reads the other two, then defends or revises its severity</text>

    <!-- reports into the coordinator -->
    <g stroke-width="2" fill="none">
      <line x1="720" y1="312" x2="720" y2="398" stroke="#C98A34" marker-end="url(#arrow)"/>
      <line x1="557" y1="594" x2="634" y2="550" stroke="#5B8DB8" marker-end="url(#arrow)"/>
      <line x1="883" y1="594" x2="806" y2="550" stroke="#6E9466" marker-end="url(#arrow)"/>
    </g>
    <text x="732" y="362" class="tiny serif" font-size="14">report</text>

    <!-- specialists -->
    <g>
      <circle cx="720" cy="240" r="70" fill="#FBEBD0" stroke="#D9963F" stroke-width="2" filter="url(#wash)"/>
      <path d="M690 226 l 9 0 l 5 -13 l 6 25 l 6 -32 l 6 30 l 5 -16 l 4 6 l 19 0" fill="none" stroke="#B87420" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="720" y="270" class="name">Seismologist</text>
    </g>
    <g>
      <circle cx="495" cy="630" r="70" fill="#E3ECF6" stroke="#5B8DB8" stroke-width="2" filter="url(#wash)"/>
      <g fill="none" stroke="#3F6F99" stroke-width="2.6" stroke-linecap="round">
        <circle cx="483" cy="618" r="3.5" fill="#3F6F99" stroke="none"/>
        <path d="M492 609 a 13 13 0 0 1 0 18"/><path d="M500 601 a 24 24 0 0 1 0 34"/><path d="M508 593 a 35 35 0 0 1 0 50"/>
      </g>
      <text x="495" y="667" class="name">Media watch</text>
    </g>
    <g>
      <circle cx="945" cy="630" r="70" fill="#E4EEDD" stroke="#6E9466" stroke-width="2" filter="url(#wash)"/>
      <g fill="none" stroke="#4E7547" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
        <path d="M929 618 l 16 -14 l 16 14 m -27 -2 v 14 h 22 v -14"/>
        <path d="M921 640 q 6 -5 12 0 t 12 0 t 12 0 t 12 0"/>
      </g>
      <text x="945" y="667" class="name">Civil protection</text>
    </g>

    <!-- coordinator: Trentren, the serpent coiled at the centre -->
    <g>
      <circle cx="720" cy="500" r="94" fill="#F6DCD3" stroke="#C8553D" stroke-width="2.4" filter="url(#wash)"/>
      <path d="M720 478 a 5 5 0 0 1 10 0 a 10 10 0 0 1 -20 0 a 15 15 0 0 1 30 0 a 20 20 0 0 1 -40 0 a 25 25 0 0 1 50 0"
            fill="none" stroke="#C8553D" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="750" cy="474" rx="7" ry="5" transform="rotate(-70 750 474)" fill="#C8553D"/>
      <circle cx="750.5" cy="471" r="1.4" fill="#FAF6EE"/>
      <text x="720" y="540" class="c serif" font-size="27" font-weight="600">Trentren</text>
      <text x="720" y="562" class="tiny c">coordinator</text>
    </g>

    <!-- tools -->
    <g>
      <g stroke="#D9963F" stroke-width="1.2" fill="#FFFDF8">
        <rect x="455" y="134" width="170" height="32" rx="16"/><rect x="395" y="209" width="150" height="32" rx="16"/>
        <rect x="805" y="134" width="190" height="32" rx="16"/><rect x="905" y="209" width="140" height="32" rx="16"/>
      </g>
      <text x="540" y="155" class="tool">escalation model</text>
      <text x="470" y="230" class="tool">prior sequence</text>
      <text x="900" y="155" class="tool">historical analogues</text>
      <text x="975" y="230" class="tool">zone memory</text>

      <g stroke="#5B8DB8" stroke-width="1.2" fill="#FFFDF8">
        <rect x="255" y="706" width="150" height="32" rx="16"/><rect x="290" y="776" width="180" height="32" rx="16"/>
      </g>
      <text x="330" y="727" class="tool">Google News</text>
      <text x="380" y="797" class="tool">web search <tspan fill="#8A8276">(Meta)</tspan></text>

      <g stroke="#6E9466" stroke-width="1.2" fill="#FFFDF8">
        <rect x="985" y="706" width="210" height="32" rx="16"/><rect x="990" y="776" width="140" height="32" rx="16"/>
      </g>
      <text x="1090" y="727" class="tool">exposure · intensity · tsunami</text>
      <text x="1060" y="797" class="tool">zone memory</text>
    </g>

    <!-- 5 · decision -->
    <path d="M816 500 L 1102 500" fill="none" stroke="#C8553D" stroke-width="2" marker-end="url(#arrowT)"/>
    <rect x="1110" y="330" width="240" height="320" rx="18" fill="#FFFDF8" stroke="#E4DCCD"/>
    <text x="1134" y="366" class="step">5 · Decide</text>
    <text x="1134" y="388" class="tiny mono">emitir_alerta()</text>
    <g>
      <rect x="1134" y="406" width="192" height="38" rx="19" fill="#F3D3C9" stroke="#C8553D"/>
      <circle cx="1154" cy="425" r="6" fill="#C8553D"/>
      <text x="1170" y="430" class="small" fill="#2B2A33" font-weight="600">alerta</text><text x="1312" y="430" class="tiny" text-anchor="end">severity 4–5</text>
      <rect x="1134" y="452" width="192" height="38" rx="19" fill="#F8E6C4" stroke="#D9963F"/>
      <circle cx="1154" cy="471" r="6" fill="#D9963F"/>
      <text x="1170" y="476" class="small" fill="#2B2A33" font-weight="600">atención</text><text x="1312" y="476" class="tiny" text-anchor="end">severity 3</text>
      <rect x="1134" y="498" width="192" height="38" rx="19" fill="#DDE8D6" stroke="#6E9466"/>
      <circle cx="1154" cy="517" r="6" fill="#6E9466"/>
      <text x="1170" y="522" class="small" fill="#2B2A33" font-weight="600">vigilancia</text><text x="1312" y="522" class="tiny" text-anchor="end">severity 1–2</text>
    </g>
    <text x="1134" y="570" class="small">→ SQLite + live map</text>
    <text x="1134" y="594" class="small">→ bulletin in ES · EN · JA</text>
    <text x="1134" y="618" class="small">→ says who it sided with</text>

    <!-- legend -->
    <g transform="translate(60 892)">
      <line x1="0" y1="-5" x2="34" y2="-5" stroke="#5E5A52" stroke-width="2"/>
      <text x="44" y="0" class="tiny">report</text>
      <line x1="110" y1="-5" x2="144" y2="-5" stroke="#9C89B8" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
      <text x="154" y="0" class="tiny">debate</text>
      <line x1="222" y1="-5" x2="256" y2="-5" stroke="#8A8276" stroke-width="1.4" stroke-dasharray="1 5" stroke-linecap="round"/>
      <text x="266" y="0" class="tiny">tool call</text>
    </g>
    <text x="1340" y="892" class="tiny" text-anchor="end">Tools are local Python functions, except web search, which is Meta's built-in tool.</text>

    <rect width="1400" height="940" filter="url(#grain)" fill="#FAF6EE"/>
  </g>
</svg>
