<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trentren · Vigía sísmico autónomo</title>
<meta name="description" content="Agentes de IA autónomos que vigilan la sismicidad de Chile, Japón y Estados Unidos, deliberan ante cada sismo y emiten un estado de alerta.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%2306070a' stroke='%23ff6b3d' stroke-width='1.5'/%3E%3Cpath d='M5 20h7l2-5 3 12 3-16 3 13 2-7 2 3h8' fill='none' stroke='%23ece7df' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body data-nivel="vigilancia">
<svg width="0" height="0" style="position:absolute">
  <symbol id="sigil" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="18.2" fill="none" stroke="var(--accent)" stroke-width="1"/>
    <circle cx="20" cy="20" r="14.6" fill="none" stroke="currentColor" stroke-width=".5" opacity=".25" stroke-dasharray="1 2.4"/>
    <path d="M4.5 20h6.2l1.6-3.4 2.4 9.6 3-17.2 3 15.4 2.2-8.6 1.8 4.4 1.4-1.4h7.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34.6" cy="18.8" r="1.25" fill="var(--accent)"/>
  </symbol>
</svg>

<header class="top">
  <a class="brand" href="#ahora">
    <svg style="color:var(--ink)"><use href="#sigil"/></svg>
    <div><div class="w">TRENTREN</div><div class="s" data-i="tagline"></div></div>
  </a>
  <nav class="seg" id="paises"></nav>
  <div class="meta">
    <div class="nivel-pill"><span class="dot"></span><b id="pillNivel">—</b></div>
    <nav class="seg small" id="idiomas"></nav>
    <div><span class="lbl" id="clockLbl"></span><span class="clock" id="clock">--:--</span></div>
  </div>
</header>
<nav class="sub" id="subnav"></nav>
<div class="seismo"><span class="cap" data-i="seismo"></span><svg id="seismo" preserveAspectRatio="none"></svg></div>

<div class="grid">
  <aside class="mapcol">
    <div class="h"><span class="t" id="mapTitle"></span><span class="c" id="mapCount"></span></div>
    <div class="maphist" id="mapHist" hidden></div>
    <svg id="map" role="img"></svg>
    <div class="legend" id="legend"></div>
  </aside>

  <main class="content">
    <section class="blk" id="ahora">
      <div class="lvl" id="lvlWord"></div>
      <div id="vigente"></div>
      <div class="kpis" id="kpis"></div>
      <h3 class="h3" data-i="pulso_t"></h3>
      <p class="lede sm" data-i="pulso_d"></p>
      <div class="pulses" id="pulses"></div>
    </section>

    <section class="blk" id="agentes">
      <div class="eyebrow" data-i="ag_eye"></div>
      <h2 data-i="ag_h"></h2>
      <p class="lede" data-i="ag_d"></p>
      <div class="pipe" id="pipe"></div>
      <div class="metabadge" id="metaBadge"></div>
    </section>

    <section class="blk" id="consejo">
      <div class="eyebrow" data-i="co_eye"></div>
      <h2 data-i="co_h"></h2>
      <div class="cpick" id="cpick"></div>
      <div id="council"></div>
    </section>

    <section class="blk" id="registro">
      <div class="eyebrow" data-i="re_eye"></div>
      <h2 data-i="re_h"></h2>
      <p class="lede" data-i="re_d"></p>
      <div class="card tablewrap"><table id="regTable"></table></div>
    </section>

    <section class="blk" id="historia">
      <div class="eyebrow" data-i="hi_eye"></div>
      <h2 data-i="hi_h"></h2>
      <p class="lede" data-i="hi_d"></p>
      <div class="tabs" id="hzTabs"></div>
      <div class="card chart" id="yearChart"></div>
      <div class="stats" id="histStats"></div>
      <h3 class="h3" data-i="hi_big"></h3>
      <div class="bigs" id="bigs"></div>
    </section>

    <section class="blk" id="simular">
      <div class="eyebrow" data-i="si_eye"></div>
      <h2 data-i="si_h"></h2>
      <p class="lede" data-i="si_d"></p>
      <div class="sims" id="sims"></div>
    </section>

    <section class="blk" id="metodo">
      <div class="eyebrow" data-i="me_eye"></div>
      <h2 data-i="me_h"></h2>
      <p class="lede" data-i="me_d"></p>
      <div class="card trainbar" id="trainbar"></div>
      <div class="stats" id="stats"></div>
      <div class="truth">
        <div class="card yes"><h4 data-i="yes_h"></h4><span data-i="yes_d"></span></div>
        <div class="card no"><h4 data-i="no_h"></h4><span data-i="no_d"></span></div>
      </div>
      <h3 class="h3" data-i="mem_h"></h3>
      <div class="card zones" id="zones"></div>
    </section>

    <section class="blk">
      <div class="card myth">
        <svg viewBox="0 0 40 40" style="width:104px;height:104px;color:var(--ink)"><use href="#sigil"/></svg>
        <p data-i="myth" data-html="1"></p>
      </div>
    </section>
  </main>
</div>

<footer>
  <div><b data-i="ft_b"></b> <span data-i="ft_d"></span> <span id="ftTsunami"></span>
    <div class="off" id="links"></div></div>
  <div><span data-i="ft_data"></span><br><span id="ftModel"></span><br><span id="uso"></span></div>
</footer>
<div class="tip" id="tip"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
